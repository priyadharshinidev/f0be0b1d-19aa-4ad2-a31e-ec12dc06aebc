name: .NET CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restore dependencies
      run: dotnet restore LIS.Tests/LIS.Tests.csproj
    
    - name: Build
      run: dotnet build LIS.Tests/LIS.Tests.csproj --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test LIS.Tests/LIS.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

    - name: Verify formatting
      run: dotnet format LIS.Tests/LIS.Tests.csproj --no-restore --verify-no-changes
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: '**/test-results.trx'

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: 'TestResults/**/coverage.cobertura.xml'
    
    - name: Publish to NuGet (if release)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        dotnet pack LIS.Cli/LIS.Cli.csproj --configuration Release --output nupkg
        dotnet nuget push nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      continue-on-error: true
